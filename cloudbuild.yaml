steps:
  # Instala dependências
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # Faz o build (se for React, Vue, etc)
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Deploy para o Firebase
  - name: 'gcr.io/$PROJECT_ID/firebase'
    args: ['deploy', '--project', '$PROJECT_ID']
